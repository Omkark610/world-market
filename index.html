<style>

<script>
/* ═══════════════ 1. DATA PROVIDER CONFIG (swap providers/keys here only) ═══════════════
   Default: Yahoo Finance public chart endpoint (delayed ~15 min, no key).
   Browsers usually block it via CORS, so route it through your own proxy/serverless function:
     proxy: u => 'https://YOUR-PROXY.example.com/?url=' + encodeURIComponent(u)
   To use another provider (Twelve Data, Finnhub, Polygon, EODHD…) re-implement Provider.quote()
   and Provider.history() so they return the shapes documented below. Nothing else needs to change.
   quote()  → {price, prev, hi, lo, h52, l52, t(ms)}
   history()→ {pts:[{t(ms), v}], prev}                                                        */
const CONFIG={
  REFRESH_MS:60000, CONCURRENCY:6, API_KEY:'',
  proxy:u=>u,
  GRAY_WHEN_CLOSED:false,            // true = closed markets render neutral gray (strict reading of the legend)
  HOLIDAYS:{ /* exchange key → ['YYYY-MM-DD',…]  e.g. 'India':['2026-11-05'] — add from your exchange calendar */ }
};
let pauseUntil=0;
async function getJSON(url){
  if(Date.now()<pauseUntil) throw Error('rate-limited');
  const r=await fetch(CONFIG.proxy(url));
  if(r.status===429){pauseUntil=Date.now()+30000;throw Error('429')}
  if(!r.ok) throw Error(r.status);
  return r.json();
}
const Y='https://query1.finance.yahoo.com/v8/finance/chart/';
const RANGES={'1D':['1d','5m'],'5D':['5d','15m'],'1M':['1mo','1d'],'6M':['6mo','1d'],'YTD':['ytd','1d'],'1Y':['1y','1d'],'5Y':['5y','1wk']};
const Provider={
  async quote(s){
    const m=(await getJSON(`${Y}${encodeURIComponent(s)}?range=1d&interval=5m`)).chart.result[0].meta;
    const prev=m.chartPreviousClose??m.previousClose;
    if(m.regularMarketPrice==null||!prev) throw Error('no data');
    return{price:m.regularMarketPrice,prev,hi:m.regularMarketDayHigh,lo:m.regularMarketDayLow,h52:m.fiftyTwoWeekHigh,l52:m.fiftyTwoWeekLow,t:m.regularMarketTime*1000};
  },
  async history(s,rg){
    const[r,i]=RANGES[rg];const x=(await getJSON(`${Y}${encodeURIComponent(s)}?range=${r}&interval=${i}`)).chart.result[0];
    const c=x.indicators.quote[0].close,pts=x.timestamp.map((t,k)=>({t:t*1000,v:c[k]})).filter(p=>p.v!=null);
    return{pts,prev:x.meta.chartPreviousClose};
  }
};
/* cache + request de-duplication */
const cache=new Map();
function Q(s){const e=cache.get(s);if(e&&Date.now()-e.ts<CONFIG.REFRESH_MS)return e.p;
  const p=Provider.quote(s).then(d=>({...d,ok:1}),()=>({ok:0}));cache.set(s,{ts:Date.now(),p});return p}
const D={};                                        // sym → latest quote result

   name|flag|capital|lat|lon|IANA tz (capital + exchange)|open|close|region|trading days|indices(sym:label;…)

const hm=s=>{const[h,m]=s.split(':');return+h*60+ +m};
const C={};RAW.split('\n').forEach((l,n)=>{const a=l.split('|');
  C[a[0]]={name:a[0],flag:a[1],cap:a[2],lat:+a[3],lon:+a[4],tz:a[5],reg:a[8],rank:n,
    h:{tz:a[5],o:hm(a[6]),c:hm(a[7]),days:a[9]?a[9].split(',').map(Number):[1,2,3,4,5],key:a[0]},
    ix:a[10].split(';').map(x=>{const i=x.indexOf(':');return{s:x.slice(0,i),n:x.slice(i+1)}})}});
const prim=c=>c.ix[0].s;                     // primary benchmark = first index; it drives the map colour
const HK={tz:'Asia/Hong_Kong',o:570,c:960,days:[1,2,3,4,5],key:'Hong Kong'};
/* Global table: [symbol,label,flag,country key,optional exchange-hours override] */
const GLOBAL=[['^GSPC','S&P 500','🇺🇸','United States of America'],['^IXIC','NASDAQ','🇺🇸','United States of America'],['^DJI','Dow Jones','🇺🇸','United States of America'],
['^GSPTSE','S&P/TSX Composite','🇨🇦','Canada'],['^BVSP','Bovespa','🇧🇷','Brazil'],['^FTSE','FTSE 100','🇬🇧','United Kingdom'],['^GDAXI','DAX','🇩🇪','Germany'],['^FCHI','CAC 40','🇫🇷','France'],
['^STOXX50E','EURO STOXX 50','🇪🇺','Germany'],['^NSEI','NIFTY 50','🇮🇳','India'],['^BSESN','SENSEX','🇮🇳','India'],['^N225','Nikkei 225','🇯🇵','Japan'],['^HSI','Hang Seng','🇭🇰','China',HK],
['000001.SS','Shanghai Composite','🇨🇳','China'],['^KS11','KOSPI','🇰🇷','South Korea'],['^AXJO','ASX 200','🇦🇺','Australia'],['^TASI.SR','Tadawul','🇸🇦','Saudi Arabia'],['^J203.JO','JSE All Share','🇿🇦','South Africa']];
const ALIAS={'New York':'United States of America','Mumbai':'India','Hong Kong':'China','Sydney':'Australia','USA':'United States of America','US':'United States of America','UK':'United Kingdom'};

/* ═══════════════ 3. TIME + MARKET STATUS (deterministic, exchange-timezone based) ═══════════════ */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],fc={};
function parts(d,tz){const f=fc[tz]||(fc[tz]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit'}));

  await Promise.all(Array.from({length:CONFIG.CONCURRENCY},async()=>{while(i<syms.length){const s=syms[i++],r=await Q(s);if(r.ok)good++;D[s]=r}}));
  $('#live').classList.toggle('on',good>0);
  if(!good){const t=$('#toast');t.style.display='block';t.innerHTML='<b>Data unavailable.</b> The market feed could not be reached (most likely a browser CORS block). Set <span class="mono">CONFIG.proxy</span> or swap <span class="mono">Provider</span> in index.html.'}
  else $('#toast').style.display='none';
  recolor();stats();renderGlobal();if(sel)renderSide()}
init().then(()=>{refresh();setInterval(refresh,CONFIG.REFRESH_MS)});

</script>
